scrapers:
  - name: LaCoupole
    url: https://ajz.ch/fr-ch/coupole/programm/
    item: li.bg-theme-black-lighter.flex.text-theme-white > div.flex.flex-col
    fields:
      - name: type
        value: concert
      - name: city
        value: Biel/Bienne
      - name: country
        value: Switzerland
      - name: location
        value: Coupole
      - name: sourceUrl
        value: https://ajz.ch/fr-ch/coupole/programm/
      - name: url
        value: https://ajz.ch/fr-ch/coupole/programm/
      - name: title
        type: text
        location:
          - selector: div.cursor-pointer.flex.flex-col.leading-\[1\].peer.px-5.py-3.uppercase > div.flex.flex-col.gap-2:nth-child(2) > h2.break-\[auto-phrase\].font-extrabold.text-\[30px\]
            # examples: [espace DISKUT, Bobby's Mic Surprise, Treffpong, '#madcollab']
      - name: comment
        type: text
        location:
          - selector: div.cursor-pointer.flex.flex-col.leading-\[1\].peer.px-5.py-3.uppercase > div.flex.flex-col.gap-1:nth-child(3) > div.font-medium
            # examples: [Échanges culturels, Performance & Fun et musique, Fun et musique, Party]
      - name: genresText
        type: text
        location:
          - selector: div.flex.flex-row.flex-wrap.xs\:flex-nowrap.gap-y-2.gap-x-5.justify-between > div.font-extrabold
        can_be_empty: true
      - name: date
        type: date
        components:
          - covers:
              day: true
              month: true
            location:
              selector: div.cursor-pointer.flex.flex-col.leading-\[1\].peer.px-5.py-3.uppercase > div.flex.flex-row.gap-5.justify-between > div.flex.flex-row.gap-1.items-end > div.font-extrabold.text-\[15px\]
              # examples: ["04.01", "04.01", "08.01", "10.01"]
            layout:
              - "02.01"
          - covers:
              time: true
            location:
              selector: div.cursor-pointer.flex.flex-col.leading-\[1\].peer.px-5.py-3.uppercase > div.flex.flex-row.gap-5.justify-between > div.flex.flex-row.gap-2:nth-child(2) > div.font-extrabold.text-\[15px\]
              regex_extract:
                exp: "[0-9]{1,2}:[0-9]{2}"
                index: 0
              # examples: ['13:00–19:00', '20:00–22:00', '18:00–23:00', '23:00–06:00']
            layout:
              - 15:04
        date_location: CET
    fetcher:
      type: static

  - name: KartellCulturel
    url: https://kartellculturel.ch/fr/programme
    item: article.event-article
    fields:
      - name: type
        value: concert
      - name: city
        value: Biel/Bienne
      - name: country
        value: Switzerland
      - name: sourceUrl
        value: https://kartellculturel.ch/fr/programme
      - name: title
        type: text
        location:
          - selector: div.event-main > div.event-data > div > div.event-column > h2
            entire_subtree: true
      - name: location
        type: text
        location:
          - selector: div.event-head > div.location
            entire_subtree: true
      - name: genresText
        type: text
        location:
          - selector: div.event-head > div.genre
            entire_subtree: true
        can_be_empty: true
      - name: date
        type: date
        components:
          - covers:
              day: true
              month: true
              year: true
            location:
              selector: div.event-head > div.date
              entire_subtree: true
              regex_extract:
                exp: "[0-9]{2}\\.[0-9]{2}\\.[0-9]{2}"
            layout: ["02.01.06"]
          - covers:
              time: true
            location:
              selector: div.event-head > div.begin
              entire_subtree: true
              regex_extract:
                exp: "[0-9]{1,2}h[0-9]{2}"
            layout: ["15h04"]
        date_location: CET
        date_language: fr_FR
      - name: url
        type: url
        location:
          - selector: a[aria-label="event details"]
            attr: href
      - name: imageUrl
        type: url
        location:
          - selector: img
            attr: src
    fetcher:
      type: dynamic
      page_load_wait_ms: 2000
    interaction:
      - type: scroll
        delay: 4000
      - type: scroll
        delay: 4000
